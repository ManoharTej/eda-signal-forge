<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Card Background Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.4)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.6)" />
    </linearGradient>

    <!-- Emerald Accent Gradient (Subject) -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Blue/Cyan Accent Gradient (Workstation) -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Violet/Purple Accent Gradient (Neural Core) -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Amber/Orange Accent Gradient (Storage) -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shadow & Glow Filters -->
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.25" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.25" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.25" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.25" />
    </filter>
    <filter id="glowLine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.4" />
    </filter>

    <!-- Glow for connecting paths -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-weight: 900; font-style: italic; fill: #ffffff; text-transform: uppercase; font-size: 28px; letter-spacing: 2px; }
    .subtitle { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; fill: #64748b; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; }
    .card-title { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-weight: 800; fill: #ffffff; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
    .card-subtitle { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }
    .body-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; fill: #94a3b8; font-size: 11px; line-height: 1.5; }
    .flow-label { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; fill: #38bdf8; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }
    .tech-pill { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
    .arrow-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; fill: #475569; font-size: 10px; }
  </style>

  <!-- Master Canvas Background -->
  <rect width="1200" height="800" rx="30" fill="url(#bgGrad)" />
  <rect width="1196" height="796" x="2" y="2" rx="28" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />

  <!-- Grid Overlay (Futuristic HUD style) -->
  <path d="M 0 100 L 1200 100 M 0 700 L 1200 700 M 200 0 L 200 800 M 1000 0 L 1000 800" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1" />

  <!-- HEADER -->
  <g transform="translate(60, 60)">
    <text class="title" x="0" y="0">Signal Forge <tspan fill="#3b82f6">Architecture</tspan></text>
    <text class="subtitle" x="0" y="22">Decentralized Multi-Node Topology &amp; Biometric Signal Flow</text>
  </g>

  <!-- ==================== NODE 1: SUBJECT NODE (Left) ==================== -->
  <g transform="translate(60, 160)" filter="url(#glowEmerald)">
    <!-- Main Card Body -->
    <rect width="250" height="420" rx="24" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1.5" />
    <rect width="250" height="420" rx="24" fill="none" stroke="url(#emeraldGrad)" stroke-width="2" stroke-dasharray="10 320 230 10" />
    
    <!-- Icon & Title -->
    <circle cx="45" cy="45" r="18" fill="rgba(16, 185, 129, 0.1)" />
    <path d="M 45 35 L 45 42 M 45 48 L 45 55 M 35 45 L 42 45 M 48 45 L 55 45" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <text class="card-title" x="80" y="42">Subject Node</text>
    <text class="card-subtitle" x="80" y="54" fill="#10b981">Ingestion &amp; Edge Client</text>
    
    <!-- Separator Line -->
    <line x1="20" y1="80" x2="230" y2="80" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <!-- Description -->
    <text class="body-text" x="20" y="105">
      <tspan x="20" dy="0">Captures raw micro-siemens (μS)</tspan>
      <tspan x="20" dy="16">electrodermal activity (GSR/EDA)</tspan>
      <tspan x="20" dy="16">signatures directly at the skin interface.</tspan>
    </text>

    <!-- Sub-component 1: Sensor Pairing -->
    <rect x="20" y="160" width="210" height="90" rx="16" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    <text class="card-subtitle" x="35" y="182" fill="#94a3b8">Two-Finger Connection</text>
    <text class="body-text" x="35" y="200" font-size="10">
      <tspan x="35" dy="0">Dual-point connection locks</tspan>
      <tspan x="35" dy="14">circuit and suppresses baseline</tspan>
      <tspan x="35" dy="14">vibration noise at the edge.</tspan>
    </text>

    <!-- Sub-component 2: Mobile Simulation -->
    <rect x="20" y="270" width="210" height="90" rx="16" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    <text class="card-subtitle" x="35" y="292" fill="#10b981">Biometric Simulator</text>
    <text class="body-text" x="35" y="310" font-size="10">
      <tspan x="35" dy="0">Simulates physical stress</tspan>
      <tspan x="35" dy="14">waveforms based on touch pressure</tspan>
      <tspan x="35" dy="14">in absence of hardware electrodes.</tspan>
    </text>

    <!-- Tech Pills -->
    <rect x="20" y="380" width="95" height="20" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" />
    <text class="tech-pill" x="30" y="393">React Native</text>
    <rect x="125" y="380" width="105" height="20" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" />
    <text class="tech-pill" x="135" y="393">Expo Sensor API</text>
  </g>

  <!-- ==================== NODE 2: WORKSTATION (Middle Left) ==================== -->
  <g transform="translate(420, 160)" filter="url(#glowBlue)">
    <rect width="260" height="420" rx="24" fill="url(#cardGrad)" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1.5" />
    <rect width="260" height="420" rx="24" fill="none" stroke="url(#blueGrad)" stroke-width="2" stroke-dasharray="10 340 240 10" />

    <!-- Icon & Title -->
    <circle cx="45" cy="45" r="18" fill="rgba(59, 130, 246, 0.1)" />
    <path d="M 37 40 L 53 40 M 37 45 L 53 45 M 37 50 L 47 50" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
    <text class="card-title" x="80" y="42">Workstation</text>
    <text class="card-subtitle" x="80" y="54" fill="#3b82f6">Next.js 14 Dashboard</text>

    <line x1="20" y1="80" x2="240" y2="80" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <text class="body-text" x="20" y="105">
      <tspan x="20" dy="0">Primary scientific orchestrator.</tspan>
      <tspan x="20" dy="16">Manages session states, logs files,</tspan>
      <tspan x="20" dy="16">and synthesizes results.</tspan>
    </text>

    <!-- Sub-component 1: 3D Visualization -->
    <rect x="20" y="160" width="220" height="90" rx="16" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    <text class="card-subtitle" x="35" y="182" fill="#38bdf8">3D Render Engine</text>
    <text class="body-text" x="35" y="200" font-size="10">
      <tspan x="35" dy="0">Interactive 3D scatter plots</tspan>
      <tspan x="35" dy="14">via React Three Fiber (Three.js)</tspan>
      <tspan x="35" dy="14">reconstructing telemetry clouds.</tspan>
    </text>

    <!-- Sub-component 2: Spring Animation -->
    <rect x="20" y="270" width="220" height="90" rx="16" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    <text class="card-subtitle" x="35" y="292" fill="#3b82f6">Fluid Interaction</text>
    <text class="body-text" x="35" y="310" font-size="10">
      <tspan x="35" dy="0">Spring physics motion and 3D</tspan>
      <tspan x="35" dy="14">tilt effects powered by GSAP</tspan>
      <tspan x="35" dy="14">and Framer Motion.</tspan>
    </text>

    <!-- Tech Pills -->
    <rect x="20" y="380" width="80" height="20" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" />
    <text class="tech-pill" x="30" y="393">Next.js 14</text>
    <rect x="110" y="380" width="60" height="20" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" />
    <text class="tech-pill" x="120" y="393">GSAP v3</text>
    <rect x="180" y="380" width="60" height="20" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" />
    <text class="tech-pill" x="190" y="393">Three.js</text>
  </g>

  <!-- ==================== NODE 3: NEURAL CORE (Middle Right) ==================== -->
  <g transform="translate(800, 160)" filter="url(#glowPurple)">
    <rect width="340" height="230" rx="24" fill="url(#cardGrad)" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1.5" />
    <rect width="340" height="230" rx="24" fill="none" stroke="url(#purpleGrad)" stroke-width="2" stroke-dasharray="10 480 340 10" />

    <!-- Icon & Title -->
    <circle cx="45" cy="45" r="18" fill="rgba(139, 92, 246, 0.1)" />
    <path d="M 45 35 A 8 8 0 0 1 51 49 L 45 52 L 39 49 A 8 8 0 0 1 45 35 Z" fill="none" stroke="#8b5cf6" stroke-width="2" />
    <text class="card-title" x="80" y="42">Neural Core</text>
    <text class="card-subtitle" x="80" y="54" fill="#8b5cf6">FastAPI Machine Learning Node</text>

    <line x1="20" y1="80" x2="320" y2="80" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Description -->
    <text class="body-text" x="20" y="105">
      <tspan x="20" dy="0">Suite of 7 unsupervised ML algorithms running in parallel.</tspan>
      <tspan x="20" dy="16">Computes "Consensus Majority Vote" and benchmarks 127</tspan>
      <tspan x="20" dy="16">model configurations against Shannon Entropy stability.</tspan>
    </text>

    <!-- Sub-components (List style) -->
    <text class="card-subtitle" x="20" y="165" fill="#d946ef">Calibrated Sandbox Specialists:</text>
    <text class="body-text" x="20" y="185" font-family="JetBrains Mono" font-size="10" fill="#a78bfa">
      CUL-v4 | GMM | K-Means | DBSCAN | Iso Forest | LOF | PCA
    </text>

    <!-- Tech Pills -->
    <rect x="20" y="198" width="65" height="18" rx="5" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" />
    <text class="tech-pill" x="28" y="210">FastAPI</text>
    <rect x="95" y="198" width="85" height="18" rx="5" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" />
    <text class="tech-pill" x="103" y="210">scikit-learn</text>
    <rect x="190" y="198" width="70" height="18" rx="5" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" />
    <text class="tech-pill" x="198" y="210">NumPy/SciPy</text>
  </g>

  <!-- ==================== NODE 4: STORAGE VAULT (Bottom Right) ==================== -->
  <g transform="translate(800, 430)" filter="url(#glowAmber)">
    <rect width="340" height="150" rx="24" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.5" />
    <rect width="340" height="150" rx="24" fill="none" stroke="url(#amberGrad)" stroke-width="2" stroke-dasharray="10 400 300 10" />

    <!-- Icon & Title -->
    <circle cx="45" cy="45" r="18" fill="rgba(245, 158, 11, 0.1)" />
    <path d="M 37 38 Q 45 35 53 38 L 53 50 Q 45 53 37 50 Z M 37 44 Q 45 41 53 44 M 37 50 Q 45 47 53 50" fill="none" stroke="#f59e0b" stroke-width="2" />
    <text class="card-title" x="80" y="42">Storage Vault</text>
    <text class="card-subtitle" x="80" y="54" fill="#f59e0b">Temporal High-Density Vault</text>

    <line x1="20" y1="80" x2="320" y2="80" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Description -->
    <text class="body-text" x="20" y="105">
      <tspan x="20" dy="0">Append-Only CSV Stream storing 13-attribute telemetry logs</tspan>
      <tspan x="20" dy="16">every 5-sec window. Anonymized User ID decouples PII records.</tspan>
    </text>

    <!-- Tech Pills -->
    <rect x="20" y="138" width="80" height="0" /> <!-- Spacer -->
  </g>

  <!-- ==================== FLOW ARROWS & CONNECTORS ==================== -->
  <g>
    <!-- Flow 1: Subject -> Workstation -->
    <path d="M 310 370 L 420 370" fill="none" stroke="url(#flowGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glowLine)" />
    <!-- Animated particle placeholder along line -->
    <circle cx="365" cy="370" r="5" fill="#10b981" />
    <text class="flow-label" x="325" y="355">Stream (BLE/WS)</text>

    <!-- Flow 2: Workstation -> Neural Core (Upper path) -->
    <path d="M 680 230 L 800 230" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round" />
    <text class="flow-label" x="702" y="215" fill="#c084fc">Matrix Latch (POST)</text>

    <!-- Flow 3: Neural Core -> Workstation (Return path) -->
    <path d="M 800 310 L 680 310" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
    <!-- Arrowhead -->
    <path d="M 685 306 L 680 310 L 685 314" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
    <text class="flow-label" x="702" y="328" fill="#60a5fa">Refined Signal (JSON)</text>

    <!-- Flow 4: Neural Core -> Storage (Downwards path) -->
    <path d="M 970 390 L 970 430" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <path d="M 966 425 L 970 430 L 974 425" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <text class="flow-label" x="980" y="415" fill="#fbbf24">Log Epoch</text>
  </g>

  <!-- ==================== FOOTER META ==================== -->
  <g transform="translate(60, 740)">
    <text class="body-text" x="0" y="0" font-family="JetBrains Mono" font-size="10" fill="#475569">
      SIGNAL FORGE PROTOCOL SPECS // LATENCY STACK: &lt;10MS NEURAL HEALING // SAMPLING RATE: 500HZ INTERNAL
    </text>
    <text class="body-text" x="1080" y="0" font-family="JetBrains Mono" font-size="10" fill="#475569" text-anchor="end">
      REST / WS DUAL-TUNNEL SECURE HANDSHAKE
    </text>
  </g>
</svg>
